name: Build Tickly Portable EXE

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 设置 MSYS2，使用 UCRT64 环境
      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Compile single portable EXE
        shell: msys2 {0}
        run: |
          set -e

          CPP=$(ls *.cpp 2>/dev/null | head -1 || true)
          if [ -z "$CPP" ]; then
            echo "::error::仓库根目录未找到 .cpp 源文件"
            exit 1
          fi
          
          if [ ! -f resource.rc ]; then
            echo "::error::未找到 resource.rc（必须包含 ID 为 1 的图标）"
            exit 1
          fi
          echo "Source: $CPP"

          # 直接使用 UCRT64 环境自带的命令，无需前缀
          windres --codepage=65001 resource.rc -O coff -o resource.o
          
          g++ -std=c++17 -O2 -municode -mwindows -static \
            "$CPP" resource.o -o Tickly.exe \
            -luser32 -lgdi32 -ladvapi32 -lshell32 -lcomctl32 -lcomdlg32

          # 去除符号表
          strip Tickly.exe
          ls -lh Tickly.exe

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Tickly-portable
          path: Tickly.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Tickly.exe